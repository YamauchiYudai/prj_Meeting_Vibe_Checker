version: '3.8'

services:
  app:
    build:
      context: .
      target: development
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    stdin_open: true
    tty: true

  tests:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: pytest
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

  lint:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: ruff check .
