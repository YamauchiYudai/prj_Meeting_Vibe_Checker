[project]
name = "meeting-vibe-checker-backend"
version = "0.1.0"
description = "Backend API for Meeting Vibe Checker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "deepface>=0.0.86",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.4",
    "tf-keras>=2.16.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0"
]
