name: Backend CI with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-format:
    name: Lint, Type Check, and Auto-Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required for git-auto-commit-action to push fixes
      pull-requests: write # Recommended when pushing to PR branches
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # By default, checkout on a PR is in detached HEAD.
          # To commit, we need to check out the head_ref.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Development Image (cached)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          target: development
          load: true
          tags: vibe-checker-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Ruff Format & Auto-fix Lint
        # Mount the backend directory so autofixes write back to the host filesystem
        run: |
          docker run --rm -v ${{ github.workspace }}/backend:/app vibe-checker-dev:latest ruff check --fix .
          docker run --rm -v ${{ github.workspace }}/backend:/app vibe-checker-dev:latest ruff format .

      - name: Commit Auto-fixes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "style: Apply Ruff auto-fixes"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Run mypy
        run: docker run --rm -v ${{ github.workspace }}/backend:/app vibe-checker-dev:latest mypy /app

  test-and-scan:
    name: Unit Tests & Security Scan
    needs: lint-and-format
    # 時間がかかるため、mainブランチへのマージ時（push イベント）のみ実行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Production Image (for scanning)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          target: production
          load: true
          tags: vibe-checker-prod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm vibe-checker-dev:latest pytest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          image-ref: 'vibe-checker-prod:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
