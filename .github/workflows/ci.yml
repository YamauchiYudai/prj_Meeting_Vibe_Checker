name: Python CI with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load (for validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: development
          load: true
          tags: vibe-checker-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-and-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Development Image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: development
          load: true
          tags: vibe-checker-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Ruff
        run: |
          docker run --rm vibe-checker-dev:latest ruff check .
          docker run --rm vibe-checker-dev:latest ruff format --check .

      - name: Run mypy
        run: docker run --rm vibe-checker-dev:latest mypy .

      - name: Run tests
        run: docker run --rm vibe-checker-dev:latest pytest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vibe-checker-dev:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
